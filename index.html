<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ベクター変換</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ベクター変換">
<meta name="theme-color" content="#2F6FDB">
<style>
  :root {
    --blue: #2F6FDB; --blue-dark: #1F4FA8; --ink: #1A2233;
    --paper: #F2F6FC; --card: #FFFFFF; --line: #D3DEEF; --muted: #5B6679; --warn: #9A5A00;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    color: var(--ink); background: var(--paper);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 20px 8px; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; margin: 0; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .ver { font-size: .8rem; color: var(--muted); }
  .status { font-size: .85rem; padding: 6px 12px; border-radius: 999px; background: #FFF4D6; color: #7A5B00; }
  .status.ready { background: #DDE8FA; color: var(--blue-dark); }
  main { padding: 8px 20px 40px; max-width: 1100px; margin: 0 auto; }
  .panel { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px; margin-top: 16px; }
  .pick { display: block; text-align: center; padding: 30px 16px; border: 3px dashed var(--line); border-radius: 14px; cursor: pointer; }
  .pick strong { display: block; font-size: 1.15rem; margin-bottom: 6px; }
  .pick span { color: var(--muted); font-size: .9rem; }
  .pick:focus-within { outline: 3px solid var(--blue); }
  input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 20px; margin-top: 18px; }
  .ctl { display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
  .ctl output { font-weight: bold; color: var(--blue-dark); }
  .ctl small { color: var(--muted); }
  .seg { display: flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg label { flex: 1; text-align: center; padding: 10px 4px; cursor: pointer; font-size: .92rem; }
  .seg input { position: absolute; opacity: 0; }
  .seg label:has(input:checked) { background: var(--blue); color: #fff; font-weight: bold; }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: -3px; }
  input[type=range] { width: 100%; height: 32px; accent-color: var(--blue); }
  button { font: inherit; font-size: 1rem; border: 0; border-radius: 12px; padding: 14px 22px; min-height: 48px; cursor: pointer; }
  .primary { background: var(--blue); color: #fff; font-weight: bold; }
  .primary:disabled { background: #A9BFE3; cursor: default; }
  .actions { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
  .progress { color: var(--muted); font-size: .9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .item { border: 2px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
  .view { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(#E8EDF5 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  .view img { max-width: 100%; max-height: 100%; }
  .meta { padding: 8px 10px 4px; font-size: .78rem; color: var(--muted); word-break: break-all; }
  .item button { display: block; width: calc(100% - 16px); margin: 4px 8px 10px; padding: 8px; min-height: 40px; font-size: .85rem; background: #E5EDFA; color: var(--blue-dark); }
  .empty { color: var(--muted); text-align: center; padding: 16px 0 4px; margin: 0; }
  [hidden] { display: none !important; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>ベクター変換</h1>
  <div class="head-right"><span class="ver">バージョン 1</span><div id="status" class="status">オフライン準備中…</div></div>
</header>
<main>
  <section class="panel">
    <label class="pick">
      <input id="file" type="file" accept="image/*" multiple>
      <strong>画像を選ぶ</strong>
      <span>複数枚まとめて選べます。JPEG・PNG・WebPなど</span>
    </label>
    <div class="controls">
      <div class="ctl">色
        <div class="seg">
          <label><input type="radio" name="mode" value="color" checked>カラー</label>
          <label><input type="radio" name="mode" value="bw">白黒</label>
        </div>
      </div>
      <label class="ctl" id="ncBox">色の数 <output id="ncV">8</output>
        <input id="nc" type="range" min="2" max="24" value="8">
        <small>少ないほどイラストらしく、多いほど元の画像に近い</small></label>
      <label class="ctl" id="bwBox" hidden>黒にする濃さ <output id="bwV">128</output>
        <input id="bw" type="range" min="30" max="230" value="128">
        <small>大きくすると、薄い線まで黒として残る</small></label>
      <label class="ctl">なめらかさ <output id="smV">3</output>
        <input id="sm" type="range" min="1" max="5" value="3">
        <small>大きいほど線がなめらかに、小さいほど細部が残る</small></label>
      <label class="ctl">小さな点を消す <output id="poV">8</output>
        <input id="po" type="range" min="0" max="40" value="8">
        <small>大きくすると、ゴミのような細かい点が消える</small></label>
      <div class="ctl">細かさ
        <div class="seg">
          <label><input type="radio" name="res" value="600">速い</label>
          <label><input type="radio" name="res" value="1000" checked>標準</label>
          <label><input type="radio" name="res" value="1600">細かい</label>
        </div>
        <small>「細かい」は時間がかかり、ファイルも大きくなる</small>
      </div>
    </div>
    <div class="actions">
      <button id="run" class="primary" disabled>変換する</button>
      <span id="progress" class="progress" aria-live="polite"></span>
    </div>
  </section>

  <section class="panel">
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty">変換したSVGがここに並びます</p>
    <div class="actions" id="allBox" hidden>
      <button id="zip" class="primary">すべてZIPで保存</button>
    </div>
  </section>
</main>

<script src="imagetracer.js"></script>
<script>
// ---- オフライン対応 ----
const statusEl = document.getElementById('status');
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready)
    .then(() => { statusEl.textContent = 'オフラインで使えます'; statusEl.classList.add('ready'); })
    .catch(() => { statusEl.textContent = 'オフライン非対応（https で開いてください）'; });
} else { statusEl.textContent = 'このブラウザはオフライン非対応です'; }

// ---- 共通 ----
const $ = (id) => document.getElementById(id);
const SMOOTH = [0, 0.5, 1, 2, 3.5, 5];
const tick = () => new Promise(r => setTimeout(r, 0));
const radio = (name) => document.querySelector(`input[name=${name}]:checked`).value;
let files = [], results = [];

for (const id of ['nc', 'bw', 'sm', 'po']) $(id).oninput = e => $(id + 'V').textContent = e.target.value;
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => {
  const bw = radio('mode') === 'bw'; $('ncBox').hidden = bw; $('bwBox').hidden = !bw;
});
$('file').onchange = e => { files = [...e.target.files]; $('run').disabled = !files.length; };

const loadImage = (src) => new Promise((ok, ng) => {
  const img = new Image(); img.onload = () => ok(img); img.onerror = ng; img.src = src;
});

// よく使われている色を代表色として選ぶ
function makePalette(data, maxColors) {
  const counts = new Map();
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 128) continue;
    const key = ((data[i] >> 3) << 10) | ((data[i + 1] >> 3) << 5) | (data[i + 2] >> 3);
    const e = counts.get(key);
    if (e) { e.n++; e.r += data[i]; e.g += data[i + 1]; e.b += data[i + 2]; }
    else counts.set(key, { n: 1, r: data[i], g: data[i + 1], b: data[i + 2] });
  }
  const cands = [...counts.values()].sort((a, b) => b.n - a.n)
    .map(e => ({ r: Math.round(e.r / e.n), g: Math.round(e.g / e.n), b: Math.round(e.b / e.n) }));
  const pal = [];
  for (const minD of [60, 35, 18, 8]) {
    for (const c of cands) {
      if (pal.length >= maxColors) break;
      if (pal.every(p => (p.r - c.r) ** 2 + (p.g - c.g) ** 2 + (p.b - c.b) ** 2 >= minD * minD)) pal.push(c);
    }
    if (pal.length >= maxColors) break;
  }
  return [{ r: 255, g: 255, b: 255, a: 0 }, ...pal.map(c => ({ ...c, a: 255 }))];
}

// 1枚をSVGに変換する
function convert(img, opt) {
  const s = Math.min(1, opt.res / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h), p = d.data;
  let pal;
  if (opt.mode === 'bw') {
    for (let i = 0; i < p.length; i += 4) {
      const lum = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
      const dark = p[i + 3] >= 128 && lum < opt.bw;
      p[i] = p[i + 1] = p[i + 2] = dark ? 0 : 255; p[i + 3] = dark ? 255 : 0;
    }
    pal = [{ r: 255, g: 255, b: 255, a: 0 }, { r: 0, g: 0, b: 0, a: 255 }];
  } else {
    for (let i = 0; i < p.length; i += 4) {
      if (p[i + 3] < 128) { p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = 0; } else p[i + 3] = 255;
    }
    pal = makePalette(p, opt.colors);
  }
  const raw = ImageTracer.imagedataToSVG(d, {
    pal, colorquantcycles: 1, ltres: SMOOTH[opt.smooth], qtres: SMOOTH[opt.smooth],
    pathomit: opt.omit, strokewidth: 1, roundcoords: 1, viewbox: true, desc: false
  });
  // 見えない（透明な）図形を取り除き、元の画像と同じ大きさで表示されるようにする
  const inner = raw.slice(raw.indexOf('>') + 1, raw.lastIndexOf('</svg>'))
    .split('<path').filter(t => t.trim() && !t.includes('opacity="0"')).map(t => '<path' + t).join('');
  const text = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${img.width}" height="${img.height}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
  return new Blob([text], { type: 'image/svg+xml' });
}

// ファイル名：元の名前の拡張子を .svg に。重複したら番号を付ける
function svgName(orig, used) {
  let base = (orig || 'image').replace(/\.[^.]+$/, '').replace(/[\\/:*?"<>|]/g, '_') || 'image';
  let name = base + '.svg', n = 2;
  while (used.has(name)) name = `${base}_${n++}.svg`;
  used.add(name); return name;
}

// 保存（iPhone/iPadは共有シートから「ファイルに保存」）
async function save(blob, name, type) {
  for (const t of [type, 'application/octet-stream']) {
    const file = new File([blob], name, { type: t });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ZIP作成（無圧縮）
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (u8) => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
async function makeZip(entries) {
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  for (const { name, blob } of entries) {
    const data = new Uint8Array(await blob.arrayBuffer()), nm = enc.encode(name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, nm.length, true);
    parts.push(lh, nm, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, nm.length, true); ch.setUint32(42, offset, true);
    central.push(ch, nm);
    offset += 30 + nm.length + data.length;
  }
  const size = central.reduce((s, p) => s + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}

// ---- 変換 ----
$('run').onclick = async () => {
  const opt = { mode: radio('mode'), colors: +$('nc').value, bw: +$('bw').value,
    smooth: +$('sm').value, omit: +$('po').value, res: +radio('res') };
  $('grid').innerHTML = ''; results = []; $('allBox').hidden = true; $('run').disabled = true;
  const used = new Set(); let failed = 0;
  for (let k = 0; k < files.length; k++) {
    $('progress').textContent = `変換しています… ${k + 1} / ${files.length}`;
    await tick();
    try {
      const url = URL.createObjectURL(files[k]);
      const img = await loadImage(url); URL.revokeObjectURL(url);
      const blob = convert(img, opt), name = svgName(files[k].name, used);
      results.push({ name, blob });
      const item = document.createElement('div'); item.className = 'item';
      const view = document.createElement('div'); view.className = 'view';
      const im = document.createElement('img'); im.alt = name; im.src = URL.createObjectURL(blob); view.appendChild(im);
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = `${name}　${(blob.size / 1024).toFixed(0)}KB`;
      const btn = document.createElement('button'); btn.textContent = 'SVG保存';
      btn.onclick = () => save(blob, name, 'image/svg+xml');
      item.append(view, meta, btn); $('grid').appendChild(item);
    } catch (e) { console.error(e); failed++; }
  }
  $('run').disabled = false;
  $('progress').textContent = failed ? `${failed} 枚は変換できませんでした（画像が大きすぎる場合は「速い」を選んでください）` : '';
  $('empty').hidden = results.length > 0;
  $('allBox').hidden = results.length < 1;
};

$('zip').onclick = async () => {
  $('zip').disabled = true; $('zip').textContent = 'ZIPを作っています…';
  try { await save(await makeZip(results), 'svg-files.zip', 'application/zip'); }
  finally { $('zip').disabled = false; $('zip').textContent = 'すべてZIPで保存'; }
};
</script>
</body>
</html>
